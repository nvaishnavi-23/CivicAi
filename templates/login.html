<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CivicAI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-container { background: white; border-radius: 1rem; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-header h1 { color: #1e40af; }
        .demo-credentials { background: #f0f9ff; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem; font-size: 0.85rem; }
        .demo-credentials p { margin: 0.25rem 0; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1><i class="bi bi-building"></i> CivicAI</h1>
            <p>Login to Your Account</p>
        </div>

        {% if errors %}
            {% for error in errors %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endfor %}
        {% endif %}

        <div class="demo-credentials">
            <strong>Demo Credentials:</strong>
            <p><strong>Admin:</strong> admin@civicai.com / admin123</p>
            <p><strong>Citizen:</strong> rajesh@civicai.com / citizen123</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="email">Email <span style="color: #dc2626;">*</span></label>
                <input type="email" id="email" name="email" required value="{{ request.form.get('email', '') }}">
            </div>

            <div class="form-group">
                <label for="password">Password <span style="color: #dc2626;">*</span></label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 600;">
                Login
            </button>

            <p style="text-align: center; margin-top: 1rem; color: #6b7280;">
                Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: #1e40af; text-decoration: none; font-weight: 600;">Register here</a>
            </p>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
